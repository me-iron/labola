name: Daily Crawl

on:
  schedule:
    # Runs at 00:00 UTC = 09:00 KST every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI
    inputs:
      days:
        description: 'Number of days to crawl'
        required: false
        default: '14'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Safety limit (usually ~30-65 min)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily crawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CRAWL_DAYS: ${{ github.event.inputs.days || '14' }}
        run: npx tsx scripts/daily-crawl.ts
